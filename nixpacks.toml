# Nixpacks config for Railway
# Uses bun only. No openssl/ffmpeg needed because Prisma runs via the
# pure-JS @prisma/adapter-pg driver adapter (no native libssl dependency).

[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = ["bun run db:generate && bun run build"]

[start]
cmd = "bun run db:deploy && bun run start:prod"
