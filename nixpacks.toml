# Nixpacks config for Railway
# Installs ffmpeg (kept for future real video cutting) and bun.

[phases.setup]
nixPkgs = ["ffmpeg", "bun"]

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = ["bun run db:generate && bun run build"]

[start]
cmd = "bun run db:deploy && bun run start:prod"
